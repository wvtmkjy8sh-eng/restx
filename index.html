<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1228">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RestX">
<meta name="description" content="RestX — contador de descanso para academia">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<title>RestX</title>
</head>
<body>
<div class="background"><img src="./assets_bg.jpg?v=6" alt=""></div>
<main class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><strong>RestX</strong><span class="brand-sub">REST TIMER</span></div>
    <button id="installBtn" class="install" hidden aria-label="Instalar RestX">↓</button>
  </header>

  <section class="timer-section">
    <div class="eyebrow">DESCANSO</div>
    <div class="timer-wrap"><div class="sound-waves" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <svg class="progress" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="42%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="150" cy="150" r="132"></circle>
        <circle id="ring" class="ring" cx="150" cy="150" r="132"></circle>
      </svg>
      <div class="timer-center">
        <span id="status">PRONTO</span>
        <div class="time"><span id="minutes">01</span><b>:</b><span id="seconds">00</span></div>
        <span class="next">PRÓXIMO EXERCÍCIO</span>
      </div>
    </div>

    <div id="done" class="done" role="status" aria-live="assertive">DESCANSO FINALIZADO</div>

    <div class="controls">
      <button type="button" id="minus" class="small-btn" aria-label="Diminuir 5 segundos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        <span>−5</span>
      </button>
      <button type="button" id="start" class="start-btn">
        <svg id="startIcon" viewBox="0 0 24 24"><path d="M8 6.5v11l10-5.5-10-5.5Z"/></svg>
        <span id="startText">Iniciar</span>
      </button>
      <button type="button" id="reset" class="small-btn" aria-label="Resetar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.1-5.3"/><path d="M4.5 4.5V9H9"/></svg>
      </button>
      <button type="button" id="plus" class="small-btn" aria-label="Aumentar 5 segundos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
        <span>+5</span>
      </button>
    </div>
  </section>

  <section class="presets">
    <span>DESCANSO RÁPIDO</span>
    <div class="preset-list">
      <button type="button" class="preset" data-time="30">30s</button>
      <button type="button" class="preset" data-time="45">45s</button>
      <button type="button" class="preset active" data-time="60">60s</button>
      <button type="button" class="preset" data-time="90">90s</button>
      <button type="button" class="preset" data-time="120">120s</button>
    </div>
  </section>

  <footer><span>Treine.</span><span>Descanse.</span><span>Repita.</span></footer>
  <audio id="restxAlertAudio" preload="auto" playsinline webkit-playsinline>
    <source src="./restx-alert.wav" type="audio/wav">
  </audio>
  <audio id="restxKeepAliveAudio" src="./restx-keepalive.wav" preload="auto" loop playsinline webkit-playsinline></audio>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
